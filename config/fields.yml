# field strengths
GL:
  description: "Left handed fieldstrengthtensor of SU3."
  helicity: -1
  tex: G_{\mathrm{L}}
GR:
  description: "Right handed fieldstrengthtensor of SU3."
  helicity: +1
  tex: G_{\mathrm{R}}
WL:
  description: "Left handed fieldstrengthtensor of SU2."
  helicity: -1
  tex: W_{\mathrm{L}}
WR:
  description: "Right handed fieldstrengthtensor of SU2."
  helicity: +1
  tex: W_{\mathrm{R}}
BL:
  description: "Left handed fieldstrengthtensor of U1."
  helicity: -1
  tex: B_{\mathrm{L}}
BR:
  description: "Right handed fieldstrengthtensor of U1."
  helicity: +1
  tex: B_{\mathrm{R}}

# fermions
L:
  description: "Lepton dublett of SU2."
  ac: True
  helicity: -1/2 | +1/2
  tex: L | L^{\dagger}
eC:
  description: "Right handed leptons."
  ac: True
  helicity: -1/2 | +1/2
  tex: e_{\mathbb{C}} | e_{\mathbb{C}}^{\dagger}
Q:
  description: "Quark dublett of SU2."
  ac: True
  helicity: -1/2 | +1/2
  tex: Q | Q^{\dagger}
uC:
  description: "Right up-type quarks."
  ac: True
  helicity: -1/2 | +1/2
  tex: u_{\mathbb{C}} | u_{\mathbb{C}}^{\dagger}
dC:
  description: "Right down-type quarks."
  ac: True
  helicity: -1/2 | +1/2
  tex: d_{\mathbb{C}} | d_{\mathbb{C}}^{\dagger}

# scalars
H:
  description: "Higgsdublett of SU2."
  helicity: 0
  tex: H | H^{\dagger}
D:
  description: "Covariant derivative."
  tex: D