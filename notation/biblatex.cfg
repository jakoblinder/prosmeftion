% Bibliography options
% Options available in the biblatex documentation, http://mirrors.ibiblio.org/CTAN/macros/latex/contrib/biblatex/doc/biblatex.pdf#47 (page 47)
% See the following for examples: https://sukhjitsehra.wordpress.com/2015/03/21/guidelines-for-customizing-biblatex-styles/


%% Basic setup
\ExecuteBibliographyOptions{% This can also be included into some internal file, e.g. _settings.tex
	alldates=comp,  % Sets the option for all dates in the datamodel to the same value. The date fields in the default data model are date, origdate, eventdate and urldate.
	date=year,  % year,  % This option controls the basic format of printed date specifications.
	firstinits=true,  % Nur Initialen der Vornamen werden in der Bibliographie dargestellt.
	sorting=none,  % Dont sort refs, but list them as they come./ Sortiere Eintraege in der Bibliographie nach Auftreten im Dokument.
%	maxnames=5,  % Truncate author list after 5 authors ...
%	minnames=3,  % ... But display at least 3 authors
%	hyperref=true,  % Use hyperref package (should be automatically detected, though)
%	backref=true,  % Back references from bibliography page to each encounter
%	backrefstyle=two,  % Combine back refs if on two consecutive pages 
	isbn=false,  % Dont print ISBN, ISSN numbers
%	autolang=hyphen
}

%% Remove specific entries 
%\AtEveryBibitem{
	%	\clearname{journal}
	%	\clearlist{page}
	%}

%% Appearance
\renewrobustcmd*{\bibinitdelim}{}  % {\,}  % Remove space between initials.

\DeclareFieldFormat[article,inbook,book,misc,online,incollection,inproceedings,patent,thesis,unpublished]{eprint}{arXiv:\href{https://arxiv.org/abs/#1}{#1}} %Direktlink zu Pdf: https://arxiv.org/pdf/#1.pdf
% Note this should also be doable automatically with the 'eprinttype = {arxiv}' field.
\DeclareFieldFormat[article,inbook,incollection,inproceedings,patent,thesis,unpublished]{journaltitle}{\mkbibitalic{#1}}

\DeclareFieldFormat[article,inbook,book,misc,online,incollection,inproceedings,patent,thesis,unpublished]{issuetitle}{\mkbibbrackets{#1}}

\renewbibmacro*{eprint}{
	\iffieldundef{eprint}{
		\printfield{doi}% <- print doi if eprint does not exist
	}{
		\texttt{
			\printfield{eprint}% <- if eprint exists: print it \usebibmacro{eprint}
			\setunit{\addspace}% Note: The '%' after each line are important, to strip trailing an beginning whitespaces!
			\printfield{issuetitle}%
		}
	}
}

\renewbibmacro*{doi+eprint+url}{% used at least in misc
	\iffieldundef{eprint}{%
		\iffieldundef{doi}{%
			\usebibmacro{url+urldate}% print the url if eprint and doi are undefined
		}{%
			\printfield{doi}
		}%
	}{%
		\texttt{
			\printfield{eprint}% <- if eprint exists: print it \usebibmacro{eprint}
			\setunit{\addspace}% Note: The '%' after each line are important, to strip trailing an beginning whitespaces!
			\printfield{issuetitle}%
		}
	}
}

\DeclareFieldFormat[article,inbook,book,misc,online,incollection,inproceedings,patent,unpublished]{date}{\mkbibparens{#1}}

%\renewbibmacro*{date+extradate}{\printtext[date]{\printdate}}

%\DeclareFieldFormat[article]{pages}{\mkbibparens{pp.\space#1}}
\DeclareFieldFormat[article,inbook,book,misc,online,incollection,inproceedings,patent,thesis,unpublished]{volume}{\mkbibbold{#1}}

% Write the following macro occurring in the book bibliographydriver
\newbibmacro*{isbn+eprint+url}{%
	\iffieldundef{isbn}{%
		\iffieldundef{eprint}{%
			\iffieldundef{doi}{%
				\usebibmacro{url+urldate}% print the url if eprint and doi are undefined
			}{%
				\printfield{doi}
			}%
		}{}%
	}{%
		\iffieldundef{url}{%
			\iffieldundef{eprint}{%
				\iffieldundef{doi}{%
					\printfield{isbn}
				}{%
					\mkbibacro{ISBN}\addcolon\space\href{https://doi.org/\thefield{doi}}{\thefield{isbn}}%
				}
			}{%
				\mkbibacro{ISBN}\addcolon\space\href{https://arxiv.org/abs/\thefield{eprint}}{\thefield{isbn}}%
			}
		}{%
			\mkbibacro{ISBN}\addcolon\space\href{\thefield{url}}{\thefield{isbn}}%
		}%
	}%
	\newunit
}

\DeclareFieldFormat[article, book, inbook, incollection, inproceedings  paten, thesis, unpublished]{title}{\mkbibitalic{#1}}

\DeclareFieldFormat[article,inbook,incollection,inproceedings,patent,unpublished]{pages}{#1}

\newbibmacro*{number+pages}{% see: https://tex.stackexchange.com/questions/430831/if-statements-in-biblatex
	%	\printfield{volume}%
	%	\setunit*{\adddot}%
	\iffieldundef{pages}{%
		\printfield{number}%
	}{%
		\printfield{pages}%
	}
	\setunit{\addcomma\space}%
	\setunit{\bibeidpunct}%
	\printfield{eid}%
}

\renewbibmacro*{publisher+location+date}{%
	%	\printlist{location}%
	%	\iflistundef{publisher}
	%	{\setunit*{\addcomma\space}}
	%	{\setunit*{\addcolon\space}}%
	\printlist{publisher}%
	\setunit*{\addspace}%
	\usebibmacro{date}%
	\newunit}

\newbibmacro*{series+volume}{%
	\printfield{series}%
	\setunit*{\addcomma\addspace}%
	\printfield{volume}%
	\newunit}


%% Bibliography driver
\DeclareBibliographyDriver{article}{% see: https://tex.stackexchange.com/questions/430831/if-statements-in-biblatex
	\usebibmacro{bibindex}% A driver should always call the two macros bibindex and begentry at the beginning and must call finentry at the end.
	\usebibmacro{begentry}%
	%	
	\usebibmacro{author}%
	%	
	\addcomma\addspace\newblock% \newunit macht Punkt?
	\usebibmacro{title}%
	\newunit\newblock%
	\iffieldundef{journaltitle}{%
		\usebibmacro{eprint}%
		\setunit{\addspace}% Leerzeichen
		\usebibmacro{date}% date
		\setunit{\addspace}%
		\usebibmacro{number+pages}%
		%		\setunit{\addcomma\addspace}\newblock%
		%		\printfield{pages}%
	}{%
		\printfield{journaltitle}%
		\setunit{\addspace}%
		\printfield{volume}%
		\setunit{\addspace}% Leerzeichen
		\usebibmacro{date}% date
		\setunit{\addspace}%
		\usebibmacro{number+pages}%
		%		\setunit{\addcomma\addspace}\newblock%
		%		\printfield{pages}%
	}
	\usebibmacro{finentry}% The finentry bibmacro calls the \finentry macro that does some clean-up work.
}

\DeclareBibliographyDriver{book}{%
	\usebibmacro{bibindex}%
	\usebibmacro{begentry}%
	\usebibmacro{author/editor+others/translator+others}%
	\addcomma\addspace{\printdelim{nametitledelim}}\newblock
	\usebibmacro{maintitle+title}%
	\newunit
	\printlist{language}%
	\newunit\newblock
	\usebibmacro{byauthor}%
	\newunit\newblock
	\usebibmacro{byeditor+others}%
	\newunit\newblock
	\printfield{edition}%
	\newunit
	%	\iffieldundef{maintitle}
	%	{\printfield{volume}%
		%		\printfield{part}}
	%	{}%
	%	\newunit
	%	\printfield{volumes}%
	\newunit\newblock
	\usebibmacro{series+volume}%
	\newunit\newblock
	\printfield{note}%
	\newunit\newblock
	\usebibmacro{publisher+location+date}%
	\newunit\newblock
	\usebibmacro{chapter+pages}%
	\newunit
	\printfield{pagetotal}%
	%	\newunit\newblock
	%	\iftoggle{bbx:isbn}
	%	{%
		%		\addcomma\addspace
		%		\usebibmacro{isbn+eprint+url}% \printfield{isbn}
		%	}
	%	{}%
	\newunit\newblock
	\usebibmacro{addendum+pubstate}%
	\setunit{\bibpagerefpunct}\newblock
	\usebibmacro{pageref}%
	\newunit\newblock
	\iftoggle{bbx:related}
	{\usebibmacro{related:init}%
		\usebibmacro{related}}
	{}%
	\usebibmacro{finentry}%
}

\DeclareBibliographyDriver{misc}{%
	\usebibmacro{bibindex}%
	\usebibmacro{begentry}%
	\usebibmacro{author/editor+others/translator+others}%
	\addcomma
	\setunit{\printdelim{nametitledelim}}\newblock
	\usebibmacro{title}%
	\newunit
	\printlist{language}%
	\newunit\newblock
	\usebibmacro{byauthor}%
	\newunit\newblock
	\usebibmacro{byeditor+others}%
	\newunit\newblock
	\printfield{howpublished}%
	\newunit\newblock
	\printfield{type}%
	\newunit
	\printfield{version}%
	\newunit
	\printfield{note}%
	\newunit\newblock
	\usebibmacro{organization+location+date}%
	\newunit\newblock
	\usebibmacro{doi+eprint+url}%
	\newunit\newblock
	\usebibmacro{addendum+pubstate}%
	\setunit{\bibpagerefpunct}\newblock
	\usebibmacro{pageref}%
	\newunit\newblock
	\iftoggle{bbx:related}
	{\usebibmacro{related:init}%
		\usebibmacro{related}}
	{}%
	\usebibmacro{finentry}%
}

\DeclareBibliographyDriver{thesis}{% Also here the '%' is important!
	\usebibmacro{bibindex}% A driver should always call the two macros bibindex and begentry at the beginning and must call finentry at the end.
	\usebibmacro{begentry}%
	%
	\usebibmacro{author}%
	\addcomma\addspace\newblock%
	\usebibmacro{title}%
	\newblock% \newunit macht Punkt?
	\setunit{\addspace}%
	\addspace%
	\mkbibparens{\iffieldequalstr{type}{MA}{MA}{PhD}%
		\addspace%
		\usebibmacro{date}% date
	}
	%
	\newunit\newblock
	\usebibmacro{eprint}%
	%
	\usebibmacro{finentry}%
}

