	\newunit\newblock
	\usebibmacro{event+venue+date}%
	\newunit\newblock
	\usebibmacro{byeditor+others}%
	\newunit\newblock
	%	\iffieldundef{maintitle}
	%	{\printfield{volume}%
		%		\printfield{part}}
	%	{}%
	%	\newunit
	%	\printfield{volumes}%
	\newunit\newblock
	\usebibmacro{series+volume}%
	\newunit\newblock
	\printfield{note}%
	\newunit\newblock
	\printlist{organization}%
	\newunit
	\usebibmacro{publisher+location+date}%
	\newunit\newblock
	\usebibmacro{chapter+pages}%
	\newunit\newblock
	%	\iftoggle{bbx:isbn}
	%	{\printfield{isbn}}
	%	{}%
